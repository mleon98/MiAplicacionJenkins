name: CI Pipeline - QA Automation

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    - name: Configurar JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Diagnóstico de Directorio (Debug)
      run: |
        echo "Directorio actual: $(pwd)"
        ls -R

    - name: Ejecutar Pruebas (Unit, BDD, Performance)
      run: mvn clean verify surefire-report:report -B -e -X

    - name: Publicar Reporte Unitario/BDD (Artefacto)
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: reporte-pruebas-qa
        path: |
          target/site/surefire-report.html
          target/cucumber-report.html

    - name: Publicar Dashboard de Performance (JMeter)
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: dashboard-performance-jmeter
        path: target/jmeter/reports/load-test-calculadora/
